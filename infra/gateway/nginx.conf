events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream grafana_backend { server grafana:3000; }
  upstream prometheus_backend { server prometheus:9090; }
  upstream alertmanager_backend { server alertmanager:9093; }
  upstream advisor_backend { server analysis-service:8000; }
  upstream orders_backend { server orders-api:8001; }
  upstream loki_backend { server loki:3100; }

  server {
    listen 8080;
    server_name _;

    location = / { root /usr/share/nginx/html; try_files /index.html =404; }
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
      proxy_pass http://grafana_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /grafana;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
      proxy_pass http://prometheus_backend/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /alertmanager { return 301 /alertmanager/; }
    location /alertmanager/ {
      proxy_pass http://alertmanager_backend/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /advisor { return 301 /advisor/; }
    location /advisor/ {
      proxy_pass http://advisor_backend/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /advisor;
    }

    location = /orders { return 301 /orders/; }
    location /orders/dev/ { return 404; }
    location /orders/ {
      proxy_pass http://orders_backend/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /orders;
    }

    location = /loki { return 301 /loki/; }
    location = /loki/ready {
      proxy_pass http://loki_backend/ready;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /loki/api/ {
      proxy_pass http://loki_backend/loki/api/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
