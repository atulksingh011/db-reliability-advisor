events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream grafana_backend {
    zone grafana_backend 64k;
    server grafana:3000 resolve;
  }
  upstream prometheus_backend {
    zone prometheus_backend 64k;
    server prometheus:9090 resolve;
  }
  upstream alertmanager_backend {
    zone alertmanager_backend 64k;
    server alertmanager:9093 resolve;
  }
  upstream advisor_backend {
    zone advisor_backend 64k;
    server analysis-service:8000 resolve;
  }
  upstream orders_backend {
    zone orders_backend 64k;
    server orders-api:8001 resolve;
  }
  upstream loki_backend {
    zone loki_backend 64k;
    server loki:3100 resolve;
  }

  server {
    listen 8080;
    server_name _;

    location = / { root /usr/share/nginx/html; try_files /index.html =404; }
    location = /grafana { return 301 /grafana/; }
    location = /grafana/ {
      set $grafana_uri /grafana/;
      proxy_pass http://grafana_backend$grafana_uri;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /grafana/ {
      proxy_pass http://grafana_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
      rewrite ^/prometheus/(.*)$ /$1 break;
      proxy_pass http://prometheus_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /alertmanager { return 301 /alertmanager/; }
    location /alertmanager/ {
      rewrite ^/alertmanager/(.*)$ /$1 break;
      proxy_pass http://alertmanager_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /advisor { return 301 /advisor/; }
    location /advisor/ {
      rewrite ^/advisor/(.*)$ /$1 break;
      proxy_pass http://advisor_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /advisor;
    }

    location = /orders { return 301 /orders/; }
    location /orders/dev/ { return 404; }
    location /orders/ {
      rewrite ^/orders/(.*)$ /$1 break;
      proxy_pass http://orders_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Prefix /orders;
    }

    location = /loki { return 301 /loki/; }
    location = /loki/ready {
      rewrite ^/loki/ready$ /ready break;
      proxy_pass http://loki_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /loki/api/ {
      rewrite ^/loki/api/(.*)$ /loki/api/$1 break;
      proxy_pass http://loki_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
